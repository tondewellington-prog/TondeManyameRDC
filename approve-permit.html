<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Manyame RDC - Document Approval Portal</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #f0f2f5; min-height: 100vh; padding: 20px; }
        .container { max-width: 900px; margin: 0 auto; background: white; border-radius: 16px; box-shadow: 0 4px 20px rgba(0,0,0,0.1); overflow: hidden; }
        .header { background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%); color: white; padding: 25px; text-align: center; }
        .header h1 { font-size: 22px; }
        .header h2 { font-size: 14px; font-weight: normal; opacity: 0.9; }
        .content { padding: 30px; }
        
        .info-card { background: #cce5ff; border-left: 5px solid #007bff; padding: 15px; border-radius: 8px; margin-bottom: 20px; }
        .details-card { background: #f8f9fa; border-radius: 12px; padding: 20px; margin-bottom: 20px; border: 1px solid #dee2e6; }
        .details-card h3 { color: #1e3c72; margin-bottom: 15px; padding-bottom: 10px; border-bottom: 2px solid #1e3c72; }
        .details-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; font-size: 14px; }
        .detail-item { padding: 8px; background: white; border-radius: 6px; }
        .detail-label { font-weight: bold; color: #1e3c72; display: block; font-size: 11px; text-transform: uppercase; margin-bottom: 4px; }
        
        .status-card { background: #e9ecef; border-radius: 12px; padding: 20px; margin-bottom: 20px; }
        .status-row { display: flex; justify-content: space-between; padding: 10px; border-bottom: 1px solid #dee2e6; }
        .status-badge { display: inline-block; padding: 4px 12px; border-radius: 20px; font-size: 12px; font-weight: bold; }
        .status-approved { background: #28a745; color: white; }
        .status-pending { background: #ffc107; color: #856404; }
        .status-waiting { background: #6c757d; color: white; }
        
        .signature-area { margin: 30px 0; text-align: center; }
        .signature-area h3 { margin-bottom: 15px; color: #333; }
        canvas { border: 2px dashed #ccc; border-radius: 8px; background: white; cursor: crosshair; margin: 10px auto; display: block; }
        .signature-controls { display: flex; gap: 10px; justify-content: center; margin: 15px 0; flex-wrap: wrap; }
        button { background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%); color: white; padding: 12px 24px; border: none; border-radius: 8px; font-size: 14px; font-weight: bold; cursor: pointer; }
        .approve-btn { background: #28a745; }
        .approve-btn:hover { background: #218838; }
        .reject-btn { background: #dc3545; }
        .reject-btn:hover { background: #c82333; }
        .clear-btn { background: #6c757d; }
        .clear-btn:hover { background: #5a6268; }
        .error { background: #f8d7da; color: #721c24; padding: 15px; border-radius: 8px; margin-top: 20px; }
        .success { background: #d4edda; color: #155724; padding: 15px; border-radius: 8px; margin-top: 20px; }
        .warning { background: #fff3cd; color: #856404; padding: 12px; border-radius: 8px; margin-bottom: 20px; }
        .loading { text-align: center; padding: 40px; color: #666; }
        
        @media (max-width: 600px) {
            .details-grid { grid-template-columns: 1fr; }
            canvas { width: 100%; height: auto; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Manyame Rural District Council</h1>
            <h2>Document Approval Portal</h2>
        </div>
        <div class="content" id="mainContent">
            <div class="loading">Loading document details...</div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        var SUPABASE_URL = 'https://ocojsigqagaehlebubdw.supabase.co';
        var SUPABASE_ANON_KEY = 'sb_publishable_njwmRaZK-bnzut7bZPDpNQ_0VolCv-C';
        
        var supabaseClient = null;
        var canvas = null;
        var ctx = null;
        var drawing = false;
        
        try {
            if (window.supabase) {
                supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
                console.log('Supabase initialized');
            }
        } catch(e) {
            console.error('Supabase init error:', e);
        }
        
        function getUrlParams() {
            var params = new URLSearchParams(window.location.search);
            return {
                token: params.get('token'),
                level: params.get('level')
            };
        }
        
        function escapeHtml(str) {
            if (!str) return '';
            return str.replace(/[&<>]/g, function(m) {
                if (m === '&') return '&amp;';
                if (m === '<') return '&lt;';
                if (m === '>') return '&gt;';
                return m;
            });
        }
        
        // ============================================
        // DOCUMENT TYPE NAME MAP
        // Add new document types here
        // ============================================
        function getDocumentTypeName(docType) {
            var typeMap = {
                'development_permit': 'Development Permit (Change of Use)',
                'building_permit': 'Building Permit',
                'inspection_cert': 'Inspection Certificate',
                'site_plan': 'Site Development Plan'
            };
            return typeMap[docType] || docType || 'Council Document';
        }
        
        // ============================================
        // DOCUMENT TITLE FOR APPROVAL PAGE
        // ============================================
        function getDocumentTitle(docType) {
            var titleMap = {
                'development_permit': 'Development Permit',
                'building_permit': 'Building Permit',
                'inspection_cert': 'Inspection Certificate',
                'site_plan': 'Site Development Plan'
            };
            return titleMap[docType] || 'Document';
        }
        
        async function loadApproval() {
            var params = getUrlParams();
            var contentDiv = document.getElementById('mainContent');
            
            if (!contentDiv) {
                console.error('mainContent element not found');
                return;
            }
            
            if (!params.token) {
                contentDiv.innerHTML = '<div class="error">Invalid approval link. No token provided.</div>';
                return;
            }
            
            if (!params.level || (params.level !== 'hod' && params.level !== 'ceo')) {
                contentDiv.innerHTML = '<div class="error">Invalid approval link. Invalid approval level.</div>';
                return;
            }
            
            if (!supabaseClient) {
                contentDiv.innerHTML = '<div class="error">Database connection error. Please refresh.</div>';
                return;
            }
            
            try {
                // Get the approval record
                var { data: approval, error } = await supabaseClient
                    .from('approvals')
                    .select('*')
                    .eq('approval_token', params.token)
                    .eq('approval_level', params.level)
                    .single();
                
                if (error || !approval) {
                    contentDiv.innerHTML = '<div class="error">Invalid or expired approval link. Please contact the planning department.</div>';
                    return;
                }
                
                if (approval.status !== 'pending') {
                    var statusText = approval.status === 'approved' ? 'already approved' : 'rejected';
                    contentDiv.innerHTML = '<div class="error">This approval request has already been ' + statusText + '.</div>';
                    return;
                }
                
                if (new Date(approval.token_expires_at) < new Date()) {
                    contentDiv.innerHTML = '<div class="error">This approval link has expired. Please request a new one.</div>';
                    return;
                }
                
                // Get the document from issued_documents
                var { data: permitDoc, error: docError } = await supabaseClient
                    .from('issued_documents')
                    .select('*')
                    .eq('id', approval.permit_id)
                    .single();
                
                if (docError || !permitDoc) {
                    contentDiv.innerHTML = '<div class="error">Document not found.</div>';
                    return;
                }
                
                var documentData = approval.permit_data || {};
                var levelName = params.level === 'hod' ? 'Head of Department' : 'Chief Executive Officer';
                
                // ============================================
                // GET DOCUMENT TYPE (DYNAMIC - works for any document)
                // ============================================
                var docType = permitDoc.document_type || 'unknown';
                var docTypeDisplay = getDocumentTypeName(docType);
                var docTitle = getDocumentTitle(docType);
                
                // ============================================
                // CEO PAGE - WAITING FOR HOD APPROVAL (WITH AUTO-REFRESH)
                // ============================================
                if (params.level === 'ceo' && !permitDoc.hod_approved) {
                    contentDiv.innerHTML = `
                        <div class="warning">
                            <strong>Waiting for HOD Approval</strong><br><br>
                            This document is waiting for HOD approval first.<br><br>
                            <strong>Document Number:</strong> ${escapeHtml(permitDoc.document_number)}<br>
                            <strong>Document Type:</strong> ${docTypeDisplay}<br><br>
                            <span id="countdownText">This page will refresh in 10 seconds...</span><br>
                            You can also <a href="#" onclick="location.reload(); return false;">click here</a> to refresh manually.
                        </div>
                    `;
                    
                    // Auto-refresh counter
                    var seconds = 10;
                    var countdownTimer = setInterval(function() {
                        seconds--;
                        var countdownSpan = document.getElementById('countdownText');
                        if (countdownSpan) {
                            countdownSpan.textContent = 'This page will refresh in ' + seconds + ' seconds...';
                        }
                        if (seconds <= 0) {
                            clearInterval(countdownTimer);
                            location.reload();
                        }
                    }, 1000);
                    
                    return;
                }
                
                // ============================================
                // DYNAMIC FIELD EXTRACTION
                // Works for any document type
                // ============================================
                // Try to get applicant name from various possible fields
                var applicantName = documentData.applicant_name || 
                                   documentData.name || 
                                   permitDoc.issued_to || 
                                   'N/A';
                
                // Try to get property/address from various possible fields
                var propertyLocation = documentData.property_location || 
                                      documentData.location || 
                                      documentData.address ||
                                      permitDoc.property_location || 
                                      'N/A';
                
                // Try to get purpose/description from various possible fields
                var documentPurpose = documentData.commercial_uses || 
                                     documentData.purpose || 
                                     documentData.description ||
                                     'Standard Approval';
                
                // Try to get application reference
                var applicationRef = documentData.application_ref || 
                                    documentData.reference || 
                                    documentData.ref ||
                                    'N/A';
                
                // Build the approval page
                contentDiv.innerHTML = `
                    <div class="info-card">
                        <strong>DOCUMENT APPROVAL REQUIRED</strong><br>
                        <strong>Approver:</strong> ${levelName}<br>
                        <strong>Document Number:</strong> ${escapeHtml(permitDoc.document_number)}<br>
                        <strong>Document Type:</strong> ${docTypeDisplay}<br>
                        <strong>Status:</strong> ${params.level === 'hod' ? 'Awaiting HOD Signature' : 'Awaiting CEO Signature'}
                    </div>
                    
                    <div class="details-card">
                        <h3>Document Details</h3>
                        <div class="details-grid">
                            <div class="detail-item">
                                <span class="detail-label">Document Number</span>
                                <span class="detail-value">${escapeHtml(permitDoc.document_number)}</span>
                            </div>
                            <div class="detail-item">
                                <span class="detail-label">Document Type</span>
                                <span class="detail-value">${docTypeDisplay}</span>
                            </div>
                            <div class="detail-item">
                                <span class="detail-label">Issue Date</span>
                                <span class="detail-value">${permitDoc.issue_date || 'N/A'}</span>
                            </div>
                            <div class="detail-item">
                                <span class="detail-label">Expiry Date</span>
                                <span class="detail-value">${permitDoc.expiry_date || 'N/A'}</span>
                            </div>
                        </div>
                    </div>
                    
                    <div class="details-card">
                        <h3>Client / Applicant Details</h3>
                        <div class="details-grid">
                            <div class="detail-item">
                                <span class="detail-label">Applicant Name</span>
                                <span class="detail-value">${escapeHtml(applicantName)}</span>
                            </div>
                            <div class="detail-item">
                                <span class="detail-label">Property Location</span>
                                <span class="detail-value">${escapeHtml(propertyLocation)}</span>
                            </div>
                            <div class="detail-item">
                                <span class="detail-label">Purpose / Use</span>
                                <span class="detail-value">${escapeHtml(documentPurpose)}</span>
                            </div>
                        </div>
                    </div>
                    
                    <div class="details-card">
                        <h3>Request Details</h3>
                        <div class="details-grid">
                            <div class="detail-item">
                                <span class="detail-label">Created By</span>
                                <span class="detail-value">${escapeHtml(permitDoc.issued_by_name)}</span>
                            </div>
                            <div class="detail-item">
                                <span class="detail-label">Created On</span>
                                <span class="detail-value">${new Date(permitDoc.created_at).toLocaleString()}</span>
                            </div>
                            <div class="detail-item">
                                <span class="detail-label">Application Reference</span>
                                <span class="detail-value">${escapeHtml(applicationRef)}</span>
                            </div>
                        </div>
                    </div>
                    
                    <div class="status-card">
                        <h3>Approval Status</h3>
                        <div class="status-row">
                            <span class="status-label">HOD Approval:</span>
                            <span class="status-badge ${permitDoc.hod_approved ? 'status-approved' : 'status-pending'}">
                                ${permitDoc.hod_approved ? 'Approved' : 'Pending'}
                            </span>
                        </div>
                        <div class="status-row">
                            <span class="status-label">CEO Approval:</span>
                            <span class="status-badge ${permitDoc.ceo_approved ? 'status-approved' : (permitDoc.hod_approved ? 'status-pending' : 'status-waiting')}">
                                ${permitDoc.ceo_approved ? 'Approved' : (permitDoc.hod_approved ? 'Pending' : 'Waiting for HOD')}
                            </span>
                        </div>
                    </div>
                    
                    <div class="signature-area">
                        <h3>Sign to Approve as ${levelName}</h3>
                        <p>Draw your signature below using your finger or mouse:</p>
                        <canvas id="signatureCanvas" width="500" height="200" style="width:100%; max-width:500px; height:auto; border:2px solid #ccc; border-radius:8px; background:white;"></canvas>
                        <div class="signature-controls">
                            <button id="clearBtn" class="clear-btn">Clear Signature</button>
                            <button id="approveBtn" class="approve-btn">Approve and Sign</button>
                            <button id="rejectBtn" class="reject-btn">Reject</button>
                        </div>
                    </div>
                `;
                
                initializeSignatureCanvas();
                
                var clearBtn = document.getElementById('clearBtn');
                var approveBtn = document.getElementById('approveBtn');
                var rejectBtn = document.getElementById('rejectBtn');
                
                if (clearBtn) clearBtn.addEventListener('click', clearSignature);
                if (approveBtn) approveBtn.addEventListener('click', function() { 
                    submitApproval('approved', params.token, params.level, approval.permit_id, permitDoc.document_number); 
                });
                if (rejectBtn) rejectBtn.addEventListener('click', function() { 
                    if (confirm('Are you sure you want to REJECT this document?')) {
                        submitApproval('rejected', params.token, params.level, approval.permit_id, permitDoc.document_number);
                    }
                });
                
            } catch (error) {
                console.error('Error:', error);
                contentDiv.innerHTML = '<div class="error">Error loading approval request. Please try again.</div>';
            }
        }
        
        function initializeSignatureCanvas() {
            canvas = document.getElementById('signatureCanvas');
            if (!canvas) {
                console.error('Canvas element not found');
                return;
            }
            
            ctx = canvas.getContext('2d');
            
            var containerWidth = canvas.parentElement.clientWidth;
            canvas.width = Math.min(500, containerWidth - 40);
            canvas.height = 200;
            
            ctx.fillStyle = 'white';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.strokeStyle = '#333';
            ctx.lineWidth = 2;
            ctx.lineCap = 'round';
            
            function startDrawing(e) {
                drawing = true;
                var pos = getCanvasCoordinates(e);
                ctx.beginPath();
                ctx.moveTo(pos.x, pos.y);
                ctx.lineTo(pos.x, pos.y);
                ctx.stroke();
                e.preventDefault();
            }
            
            function draw(e) {
                if (!drawing) return;
                e.preventDefault();
                var pos = getCanvasCoordinates(e);
                ctx.lineTo(pos.x, pos.y);
                ctx.stroke();
                ctx.beginPath();
                ctx.moveTo(pos.x, pos.y);
            }
            
            function stopDrawing() {
                drawing = false;
                ctx.beginPath();
            }
            
            function getCanvasCoordinates(e) {
                var rect = canvas.getBoundingClientRect();
                var scaleX = canvas.width / rect.width;
                var scaleY = canvas.height / rect.height;
                
                var clientX, clientY;
                if (e.touches) {
                    clientX = e.touches[0].clientX;
                    clientY = e.touches[0].clientY;
                } else {
                    clientX = e.clientX;
                    clientY = e.clientY;
                }
                
                var x = (clientX - rect.left) * scaleX;
                var y = (clientY - rect.top) * scaleY;
                x = Math.max(0, Math.min(canvas.width, x));
                y = Math.max(0, Math.min(canvas.height, y));
                return { x: x, y: y };
            }
            
            canvas.addEventListener('mousedown', startDrawing);
            canvas.addEventListener('mousemove', draw);
            canvas.addEventListener('mouseup', stopDrawing);
            canvas.addEventListener('mouseleave', stopDrawing);
            canvas.addEventListener('touchstart', startDrawing);
            canvas.addEventListener('touchmove', draw);
            canvas.addEventListener('touchend', stopDrawing);
        }
        
        function clearSignature() {
            if (!ctx || !canvas) return;
            ctx.fillStyle = 'white';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.strokeStyle = '#333';
            ctx.lineWidth = 2;
        }
        
        async function submitApproval(status, token, level, documentId, documentNumber) {
            var contentDiv = document.getElementById('mainContent');
            if (!contentDiv) return;
            
            contentDiv.innerHTML = '<div class="loading">Processing your decision...</div>';
            
            try {
                var signatureDataUrl = null;
                if (status === 'approved' && canvas && ctx) {
                    signatureDataUrl = canvas.toDataURL('image/png');
                }
                
                var userAgent = navigator.userAgent;
                
                // Update the approval record for this level
                var { error: updateError } = await supabaseClient
                    .from('approvals')
                    .update({
                        status: status,
                        signature_image_url: signatureDataUrl,
                        signed_at: new Date().toISOString(),
                        ip_address: 'client-side',
                        user_agent: userAgent
                    })
                    .eq('approval_token', token)
                    .eq('approval_level', level);
                
                if (updateError) throw updateError;
                
                // HOD approved - update document and send email to CEO
                if (level === 'hod' && status === 'approved') {
                    console.log('HOD approval - updating document:', documentId);
                    
                    // Update the document
                    var { error: docUpdateError } = await supabaseClient
                        .from('issued_documents')
                        .update({
                            hod_approved: true,
                            approval_status: 'pending_ceo'
                        })
                        .eq('id', documentId);
                    
                    if (docUpdateError) {
                        console.error('Document update error:', docUpdateError);
                        throw new Error('Failed to update document: ' + docUpdateError.message);
                    }
                    
                    console.log('Document updated successfully');
                    
                    // Get CEO from database
                    var { data: ceoData, error: ceoError } = await supabaseClient
                        .from('ceos')
                        .select('*')
                        .eq('is_active', true)
                        .limit(1);
                    
                    if (ceoData && ceoData.length > 0) {
                        var ceo = ceoData[0];
                        
                        // Get CEO approval token
                        var { data: ceoApproval, error: ceoApprovalError } = await supabaseClient
                            .from('approvals')
                            .select('approval_token')
                            .eq('permit_id', documentId)
                            .eq('approval_level', 'ceo')
                            .single();
                        
                        if (ceoApproval && ceoApproval.approval_token) {
                            var ceoApprovalUrl = window.location.origin + '/TondeManyameRDC/approve-permit.html?token=' + ceoApproval.approval_token + '&level=ceo';
                            
                            console.log('Sending CEO email to:', ceo.email);
                            console.log('CEO Approval URL:', ceoApprovalUrl);
                            
                            // Send email to CEO
                            try {
                                var emailResponse = await fetch(SUPABASE_URL + '/functions/v1/send-email', {
                                    method: 'POST',
                                    headers: { 'Content-Type': 'application/json' },
                                    body: JSON.stringify({
                                        to: ceo.email,
                                        subject: 'Document Final Approval Required - ' + documentNumber,
                                        permitNumber: documentNumber,
                                        approvalUrl: ceoApprovalUrl,
                                        approverName: ceo.name,
                                        level: 'ceo'
                                    })
                                });
                                console.log('CEO email sent to:', ceo.email);
                            } catch(e) {
                                console.error('CEO email error:', e);
                            }
                        }
                    }
                }
                
                // CEO approved - finalize document
                if (level === 'ceo' && status === 'approved') {
                    var { error: docUpdateError } = await supabaseClient
                        .from('issued_documents')
                        .update({
                            ceo_approved: true,
                            approval_status: 'approved',
                            status: 'active'
                        })
                        .eq('id', documentId);
                    
                    if (docUpdateError) {
                        console.error('CEO document update error:', docUpdateError);
                        throw new Error('Failed to finalize document: ' + docUpdateError.message);
                    }
                    
                    console.log('Document fully approved');
                }
                
                if (status === 'approved') {
                    var message = level === 'hod' 
                        ? 'HOD approval successful. An email has been sent to the CEO for final approval.'
                        : 'CEO approval successful. The document has been fully approved. The officer can now download the PDF.';
                    
                    contentDiv.innerHTML = `
                        <div class="success">
                            <strong>Approval Successful</strong><br><br>
                            ${message}<br><br>
                            <a href="index.html" style="color: #155724;">Return to Dashboard</a>
                        </div>
                    `;
                } else {
                    contentDiv.innerHTML = `
                        <div class="error">
                            <strong>Document Rejected</strong><br><br>
                            The document has been rejected.<br><br>
                            <a href="index.html" style="color: #721c24;">Return to Dashboard</a>
                        </div>
                    `;
                }
                
            } catch (error) {
                console.error('Error:', error);
                contentDiv.innerHTML = '<div class="error">Error processing approval: ' + error.message + '</div>';
            }
        }
        
        // Start the approval loading
        loadApproval();
    </script>
</body>
</html>

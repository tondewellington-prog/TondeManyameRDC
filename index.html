<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manyame RDC - Development Permit System</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Times New Roman', 'Segoe UI', Georgia, serif;
            background: #e0e0e0;
            padding: 20px;
        }

        /* Tabs */
        .tabs {
            max-width: 1200px;
            margin: 0 auto 20px auto;
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }

        .tab-btn {
            padding: 12px 28px;
            background: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            font-family: 'Segoe UI', sans-serif;
        }

        .tab-btn.active {
            background: #1e3c72;
            color: white;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.15);
            overflow: hidden;
        }

        .header {
            background: #1e3c72;
            color: white;
            padding: 20px 30px;
        }

        .header h1 {
            font-size: 22px;
        }

        .header h2 {
            font-size: 14px;
            font-weight: normal;
            opacity: 0.85;
        }

        .content {
            padding: 30px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
        }

        .form-group {
            margin-bottom: 5px;
        }

        .form-group.full-width {
            grid-column: span 2;
        }

        label {
            display: block;
            font-weight: 600;
            margin-bottom: 6px;
            color: #333;
            font-size: 13px;
            font-family: 'Segoe UI', sans-serif;
        }

        input, select, textarea {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 14px;
            font-family: inherit;
        }

        textarea {
            resize: vertical;
            min-height: 60px;
        }

        button {
            background: #1e3c72;
            color: white;
            padding: 14px 24px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
            font-family: 'Segoe UI', sans-serif;
        }

        button:hover {
            background: #2a5298;
            transform: translateY(-1px);
        }

        .btn-generate {
            background: #28a745;
            font-size: 18px;
            padding: 16px;
            margin-top: 20px;
            width: 100%;
        }

        .btn-generate:hover {
            background: #218838;
        }

        .logout-btn {
            background: #6c757d;
            width: auto;
            padding: 8px 20px;
        }

        .staff-info {
            background: #e9ecef;
            padding: 15px 20px;
            border-radius: 8px;
            margin-bottom: 25px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-family: 'Segoe UI', sans-serif;
        }

        .hidden {
            display: none;
        }

        .error, .success {
            padding: 12px;
            border-radius: 6px;
            margin-top: 15px;
            font-family: 'Segoe UI', sans-serif;
        }

        .error {
            background: #f8d7da;
            color: #721c24;
            border-left: 4px solid #dc3545;
        }

        .success {
            background: #d4edda;
            color: #155724;
            border-left: 4px solid #28a745;
        }

        .loading {
            text-align: center;
            padding: 20px;
            color: #666;
        }

        /* Permit Document Styles - For PDF/Print */
        .permit-document {
            max-width: 1100px;
            margin: 0 auto;
            background: white;
            padding: 40px;
            font-family: 'Times New Roman', Georgia, serif;
            line-height: 1.4;
            color: black;
        }

        .permit-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 20px;
            border-bottom: 2px solid #333;
            padding-bottom: 15px;
        }

        .council-logo {
            text-align: center;
        }

        .council-logo .seal {
            font-size: 48px;
        }

        .council-name {
            text-align: center;
            flex: 1;
        }

        .council-name h1 {
            font-size: 22px;
            font-weight: bold;
            margin: 0;
        }

        .council-name h2 {
            font-size: 12px;
            font-weight: normal;
            margin: 5px 0 0;
        }

        .qr-placeholder {
            text-align: right;
        }

        .qr-placeholder img {
            width: 100px;
            height: 100px;
            border: 1px solid #ccc;
        }

        .permit-ref {
            background: #f5f5f5;
            padding: 12px;
            margin: 15px 0;
            font-size: 14px;
            border-left: 3px solid #1e3c72;
        }

        .permit-title {
            text-align: center;
            margin: 20px 0;
        }

        .permit-title h3 {
            font-size: 20px;
            text-decoration: underline;
            font-weight: bold;
        }

        .permit-title h4 {
            font-size: 16px;
            font-weight: normal;
        }

        .conditions-list {
            margin: 20px 0;
            padding-left: 20px;
        }

        .conditions-list li {
            margin-bottom: 10px;
            text-align: justify;
        }

        .signature-block {
            margin: 30px 0 20px;
            display: flex;
            justify-content: space-between;
        }

        .signature-line {
            width: 45%;
        }

        .signature-line p {
            margin: 5px 0;
        }

        .signature-name {
            border-top: 1px solid black;
            padding-top: 5px;
            margin-top: 30px;
        }

        .footer-note {
            margin-top: 30px;
            font-size: 11px;
            border-top: 1px solid #ccc;
            padding-top: 15px;
        }

        .warning-box {
            background: #fff3cd;
            padding: 12px;
            margin: 20px 0;
            border-left: 4px solid #ffc107;
        }

        .print-area {
            background: #f9f9f9;
            padding: 20px;
            border-radius: 8px;
            margin-top: 30px;
        }

        .btn-group {
            display: flex;
            gap: 15px;
            margin-top: 20px;
            justify-content: center;
        }

        .btn-pdf {
            background: #dc3545;
        }

        .btn-pdf:hover {
            background: #c82333;
        }

        @media print {
            body {
                background: white;
                padding: 0;
                margin: 0;
            }
            .no-print, .tabs, .staff-info, .btn-group, .print-area button {
                display: none;
            }
            .permit-document {
                padding: 20px;
                margin: 0;
            }
            .print-area {
                background: white;
                padding: 0;
            }
        }
    </style>
</head>
<body>
    <div class="tabs no-print">
        <button class="tab-btn active" onclick="showTab('verify')">🔍 Verify Permit</button>
        <button class="tab-btn" onclick="showTab('staff')">👨‍💼 Staff Login</button>
    </div>

    <!-- Verify Tab -->
    <div id="verifyTab" class="container">
        <div class="header">
            <h1>🏛️ Manyame Rural District Council</h1>
            <h2>Official Development Permit Verification System</h2>
        </div>
        <div class="content">
            <div class="form-group">
                <label>Enter Permit Number to Verify</label>
                <input type="text" id="verifyPermitNo" placeholder="Example: MANY/09/2026">
            </div>
            <button onclick="verifyPermit()">🔍 Verify Permit</button>
            <div id="verifyResult"></div>
        </div>
    </div>

    <!-- Staff Tab -->
    <div id="staffTab" class="container hidden">
        <div class="header">
            <h1>🏛️ Manyame RDC - Planning Department</h1>
            <h2>Development Permit Issuance System</h2>
        </div>
        <div class="content">
            <div id="staffLoginSection">
                <div class="error" style="background:#fff3cd; color:#856404;">
                    ⚠️ <strong>Authorized Access Only</strong><br>
                    This system is for Manyame RDC Planning Department staff only.
                </div>
                <div class="form-group">
                    <label>Email Address</label>
                    <input type="email" id="loginEmail" placeholder="staff@manyame.gov.zw">
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" id="loginPassword" placeholder="Enter your password">
                </div>
                <button onclick="staffLogin()">🔐 Login to System</button>
                <div id="loginError"></div>
            </div>

            <div id="issuanceSection" class="hidden">
                <div class="staff-info">
                    <span>Welcome, <strong id="staffName"></strong></span>
                    <button class="logout-btn" onclick="staffLogout()">🚪 Logout</button>
                </div>

                <form id="permitForm">
                    <div class="form-grid">
                        <div class="form-group">
                            <label>Property Location *</label>
                            <input type="text" id="propertyLocation" required placeholder="e.g., Subdivision 1 of Enslidale Farm">
                        </div>
                        <div class="form-group">
                            <label>Applicant Name *</label>
                            <input type="text" id="applicantName" required placeholder="e.g., Tonderai Nyamandi">
                        </div>
                        <div class="form-group">
                            <label>Company Name (if applicable)</label>
                            <input type="text" id="companyName" placeholder="e.g., Youth Engage Investments">
                        </div>
                        <div class="form-group">
                            <label>Application Date *</label>
                            <input type="date" id="applicationDate" required>
                        </div>
                        <div class="form-group">
                            <label>Application Reference No *</label>
                            <input type="text" id="applicationRef" required placeholder="e.g., MANYA/05/2023">
                        </div>
                        <div class="form-group">
                            <label>Council Resolution No *</label>
                            <input type="text" id="councilResolution" required placeholder="e.g., Full Council FC13 645.12">
                        </div>
                        <div class="form-group full-width">
                            <label>Commercial Uses (separate with commas) *</label>
                            <textarea id="commercialUses" required>WAREHOUSE, PETROL FILLING STATION, FOOD COURT, TRUCK STOP, SHOPPING MALL</textarea>
                        </div>
                        <div class="form-group">
                            <label>Issued At (Town) *</label>
                            <input type="text" id="issuedAtTown" required value="BEATRICE">
                        </div>
                        <div class="form-group">
                            <label>Issue Date *</label>
                            <input type="date" id="issueDate" required>
                        </div>
                        <div class="form-group">
                            <label>Applicant Representative Name *</label>
                            <input type="text" id="applicantRep" required placeholder="e.g., CHARLES SIWELA">
                        </div>
                        <div class="form-group">
                            <label>Applicant ID Number *</label>
                            <input type="text" id="applicantId" required placeholder="e.g., 59 069210 M 32">
                        </div>
                        <div class="form-group">
                            <label>Applicant Witness Name *</label>
                            <input type="text" id="applicantWitness" required placeholder="e.g., N.Tsaha">
                        </div>
                        <div class="form-group">
                            <label>Council Representative Name *</label>
                            <input type="text" id="councilRep" required placeholder="e.g., F.Guta">
                        </div>
                        <div class="form-group">
                            <label>Council Witness Name *</label>
                            <input type="text" id="councilWitness" required placeholder="e.g., C.Murepa">
                        </div>
                        <div class="form-group">
                            <label>Expiry Date *</label>
                            <input type="date" id="expiryDate" required>
                        </div>
                    </div>
                    <button type="submit" class="btn-generate">📄 Generate Development Permit & Download PDF</button>
                </form>

                <div id="issueResult"></div>
                
                <!-- Permit Display Area -->
                <div id="permitDisplayArea" class="print-area hidden"></div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        // Supabase Configuration
        const SUPABASE_URL = 'https://ocojsigqagaehlebubdw.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_njwmRaZK-bnzut7bZPDpNQ_0VolCv-C';
        
        let supabase = null;
        try {
            if (window.supabase) {
                supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
            }
        } catch(e) {
            console.error("Supabase init error");
        }

        let currentStaffUser = sessionStorage.getItem('staffEmail');
        const today = new Date().toISOString().split('T')[0];
        
        // Set default dates
        document.addEventListener('DOMContentLoaded', function() {
            const applicationDateInput = document.getElementById('applicationDate');
            const issueDateInput = document.getElementById('issueDate');
            const expiryDateInput = document.getElementById('expiryDate');
            
            if (applicationDateInput) {
                const oneYearAgo = new Date();
                oneYearAgo.setFullYear(oneYearAgo.getFullYear() - 1);
                applicationDateInput.value = oneYearAgo.toISOString().split('T')[0];
            }
            if (issueDateInput) issueDateInput.value = today;
            if (expiryDateInput) {
                const nextYear = new Date();
                nextYear.setFullYear(nextYear.getFullYear() + 1);
                expiryDateInput.value = nextYear.toISOString().split('T')[0];
            }
        });

        function showTab(tab) {
            const verifyTab = document.getElementById('verifyTab');
            const staffTab = document.getElementById('staffTab');
            const btns = document.querySelectorAll('.tab-btn');
            
            if (tab === 'verify') {
                verifyTab.classList.remove('hidden');
                staffTab.classList.add('hidden');
                btns[0].classList.add('active');
                btns[1].classList.remove('active');
            } else {
                verifyTab.classList.add('hidden');
                staffTab.classList.remove('hidden');
                btns[0].classList.remove('active');
                btns[1].classList.add('active');
                checkStaffLoginState();
            }
        }

        function checkStaffLoginState() {
            const cachedName = sessionStorage.getItem('staffDisplayName');
            if (currentStaffUser && cachedName) {
                showIssuanceForm(currentStaffUser, cachedName);
            } else {
                showStaffLoginForm();
            }
        }

        function showStaffLoginForm() {
            document.getElementById('staffLoginSection').classList.remove('hidden');
            document.getElementById('issuanceSection').classList.add('hidden');
        }

        function showIssuanceForm(email, displayName) {
            document.getElementById('staffLoginSection').classList.add('hidden');
            document.getElementById('issuanceSection').classList.remove('hidden');
            document.getElementById('staffName').innerHTML = displayName;
        }

        async function staffLogin() {
            const email = document.getElementById('loginEmail').value.trim().toLowerCase();
            const password = document.getElementById('loginPassword').value;
            const errorDiv = document.getElementById('loginError');
            
            errorDiv.innerHTML = '<div class="loading">⏳ Authenticating...</div>';
            
            try {
                const { data: authData, error: authError } = await supabase.auth.signInWithPassword({
                    email: email,
                    password: password
                });
                
                if (authError) throw authError;
                
                const { data: profileData } = await supabase
                    .from('profiles')
                    .select('full_name')
                    .eq('email', email)
                    .maybeSingle();
                
                const displayName = (profileData && profileData.full_name) ? profileData.full_name : email.split('@')[0];
                
                currentStaffUser = email;
                sessionStorage.setItem('staffEmail', email);
                sessionStorage.setItem('staffDisplayName', displayName);
                
                errorDiv.innerHTML = '';
                showIssuanceForm(email, displayName);
                
            } catch (error) {
                errorDiv.innerHTML = `<div class="error">❌ ${error.message || 'Invalid credentials'}</div>`;
                document.getElementById('loginPassword').value = '';
            }
        }

        async function staffLogout() {
            if(supabase) await supabase.auth.signOut();
            sessionStorage.removeItem('staffEmail');
            sessionStorage.removeItem('staffDisplayName');
            currentStaffUser = null;
            showStaffLoginForm();
            document.getElementById('permitDisplayArea').classList.add('hidden');
            document.getElementById('issueResult').innerHTML = '';
        }

        function generatePermitNumber() {
            const year = new Date().getFullYear();
            const random = Math.floor(Math.random() * 900) + 100;
            return `MANY/${random}/${year}`;
        }

        function generatePermitHTML(data, qrUrl) {
            const issueDateFormatted = new Date(data.issue_date).toLocaleDateString('en-GB', { day: 'numeric', month: 'long', year: 'numeric' });
            const applicationDateFormatted = new Date(data.application_date).toLocaleDateString('en-GB', { day: 'numeric', month: 'long', year: 'numeric' });
            const expiryDateFormatted = new Date(data.expiry_date).toLocaleDateString('en-GB', { day: 'numeric', month: 'long', year: 'numeric' });
            
            const day = new Date(data.issue_date).getDate();
            const month = new Date(data.issue_date).toLocaleString('en-GB', { month: 'long' });
            const year = new Date(data.issue_date).getFullYear();
            
            return `
            <div class="permit-document">
                <div class="permit-header">
                    <div class="council-logo">
                        <div class="seal">🏛️</div>
                    </div>
                    <div class="council-name">
                        <h1>MANYAME RURAL DISTRICT COUNCIL</h1>
                        <h2>RURAL DISTRICT COUNCILS ACT, CHAPTER 29:13 - SECTION (3)</h2>
                    </div>
                    <div class="qr-placeholder">
                        <img src="${qrUrl}" alt="QR Code" width="100" height="100">
                    </div>
                </div>
                
                <div class="permit-ref">
                    <strong>REFERENCE:</strong> ${escapeHtml(data.property_location)}<br>
                    <strong>PERMIT NO:</strong> ${escapeHtml(data.permit_number)}<br>
                    <strong>APPLICANT:</strong> ${escapeHtml(data.applicant_name)}${data.company_name ? ' (' + escapeHtml(data.company_name) + ')' : ''}
                </div>
                
                <div class="permit-title">
                    <h3>DEVELOPMENT PERMIT</h3>
                    <h4>CHANGE OF USE ON ${escapeHtml(data.property_location.toUpperCase())}: SEKE DISTRICT</h4>
                </div>
                
                <p>The MANYAME Rural District Council (hereinafter called "the Local Authority") in terms of Section 3 of the RURAL DISTRICT COUNCILS ACT, Chapter 29:13 (hereinafter called "the Act") hereby grants a <strong>PERMIT</strong> in respect of an application dated ${applicationDateFormatted} and numbered ${escapeHtml(data.application_ref)} in the Register of the Chief Executive Officer, MANYAME Rural District Council, to <strong>${escapeHtml(data.company_name || data.applicant_name)}</strong> (hereinafter called "the applicant") for:-</p>
                
                <p><strong>This Permit is granted subject to the conditions set hereunder Part I to III.</strong></p>
                
                <p>In these conditions:<br>
                The Owner means the person in whose favour any of the stands is subsequently transferred to by the Registrar of Deeds<br>
                The Local Authority means MANYAME Rural District Council or its successors.</p>
                
                <p>This permit is issued subject to the following conditions:-</p>
                
                <ol class="conditions-list">
                    <li>That council consent to the establishment of a business centre on portion of ${escapeHtml(data.property_location)} through <strong>${escapeHtml(data.council_resolution)}.</strong></li>
                    <li>The applicant to engage a private planning consultant to produce a layout plan and report for submission to the Department of Spatial Planning and Development for approval.</li>
                    <li>No development shall take place unless in accordance with approved layout plan and report to be submitted by the applicant to the Department of Spatial Planning.</li>
                    <li>The applicant undertakes to commence the erection of buildings and other structures according to council by laws and any other regulations.</li>
                    <li>During the period of the permit, all rates and taxes and other charges as would be payable by the registered owner of the stand, will be paid to the Local authority, and they have the right to ask, demand, sue for and recover all such rates and taxes.</li>
                    <li>The applicant shall meet the full cost of servicing the land in terms of water, sewerage, storm water drains and roads.</li>
                    <li>The applicant must obtain relevant authorization from different government departments and other relevant agencies. The owner must apply for relevant licences from the local authority and other relevant agencies before operating.</li>
                    <li>The applicant shall not occupy, or cause, or suffer or permit any person or persons to occupy any stand hereby approved until the buildings have been completed to the satisfaction of the Local authority.</li>
                    <li>Representatives of the Local authority shall be entitled to enter on the stand at all reasonable times during the daytime, to inspect the state and condition thereof and of the building that have been or are being erected thereon.</li>
                    <li>The portion of the stand <strong>shall be used for COMMERCIAL PURPOSES THAT IS THE ESTABLISHMENT OF ${escapeHtml(data.commercial_uses).toUpperCase()}</strong> and the only buildings which may be erected or used thereon shall consists of not more than building designed for uses as detailed in the application and a guard room.</li>
                    <li>The site coverage, inclusive of outbuildings shall not be less than 30% of the area of the stand.</li>
                    <li>The stand shall not be occupied until:-<br>
                        a) Approved buildings have been erected and completed thereon.<br>
                        b) A reticulated water supply has been connected thereto: and<br>
                        c) A sanitary system to the approval of the Manyame Rural District Council has been installed thereon.</li>
                    <li>No building other than boundary walls or fences shall be erected within 50 meters of the state road servitude or within 9 meters of any other boundary of the stand.</li>
                    <li>No culvert or other means of access to the stand shall be constructed except with the consent of and to a specification approved by the Manyame Rural District Council and the Provincial Roads Engineer.</li>
                    <li>The developer must consult the Provincial engineer before constructing access road to the stand.</li>
                    <li>Servitude over the stand for all water supply, sewerage and public utility purposes shall be granted by the owner as and when required.</li>
                    <li>The applicant must attend to any issues that may be raised by council from time to time during site inspections:</li>
                    <li>The bricks shall meet with the standard Association of Zimbabwe requirements.</li>
                    <li>That all Manyame Rural District Council By Laws relating to building be adhered to.</li>
                    <li>That all clauses agreed to between you and the Manyame Rural District Council be binding.</li>
                </ol>
                
                <p>Dated at <strong>${escapeHtml(data.issued_at_town)}</strong> this <strong>${day}<sup>${getOrdinal(day)}</sup></strong> day of <strong>${month}</strong> Year <strong>${year}</strong></p>
                
                <div class="signature-block">
                    <div class="signature-line">
                        <p>.............................................</p>
                        <p><strong>${escapeHtml(data.applicant_rep)}</strong> ID NUMBER (${escapeHtml(data.applicant_id)})</p>
                        <p><strong>For Applicant</strong></p>
                    </div>
                    <div class="signature-line">
                        <p>.............................................</p>
                        <p><strong>${escapeHtml(data.applicant_witness)}</strong></p>
                        <p><strong>Witness</strong></p>
                    </div>
                </div>
                
                <div class="signature-block">
                    <div class="signature-line">
                        <p>.............................................</p>
                        <p><strong>${escapeHtml(data.council_rep)}</strong></p>
                        <p><strong>For MANYAME RURAL DISTRICT COUNCIL</strong></p>
                    </div>
                    <div class="signature-line">
                        <p>.............................................</p>
                        <p><strong>${escapeHtml(data.council_witness)}</strong></p>
                        <p><strong>Witness</strong></p>
                    </div>
                </div>
                
                <p><u>Copies To:</u><br>
                Change of Use Permits File (1) File Copy (1)<br>
                Department of Spatial Planning and development File Copy (10)<br>
                <strong>CHIEF EXECUTIVE OFFICER -- MANYAME RURAL DISTRICT COUNCIL</strong></p>
                
                <div class="warning-box">
                    <strong>THE ATTENTION OF THE APPLICANT IS DRAWN TO THE FOLLOWING MATTERS</strong><br><br>
                    <strong>WARNING</strong><br>
                    Attention is drawn to the fact that any action taken in pursuance of the granting of this <strong>PERMIT</strong> within the period allowed for appeals shall be at the risk of the person taking the action concerned.<br><br>
                    <strong>EXPIRY OF PERMIT</strong><br>
                    This permit expires, if unimplemented, on ${expiryDateFormatted} unless the period of validity is extended by the Local Planning Authority in writing.<br><br>
                    <strong>EXTENSION OF TIME</strong><br>
                    PERMIT holders are warned that no extension of the period referred above of the PERMIT will be granted unless the Local Planning Authority is satisfied that good sufficient reasons exist for any request made.<br><br>
                    <strong>COPIES OF THE PERMIT</strong><br>
                    Copies of this Permit may be obtained on payment of the prescribed fee from the issuing Local Planning Authority. In this regard the <strong>PERMIT</strong> number and file reference should be quoted on all correspondence.<br><br>
                    <strong>AMENDMENT TO THE PERMIT</strong><br>
                    Amendment to this Permit can only be made as provided by the law. Correspondence in this connection must quote the details referred to in paragraph 3 above. Any change required which is not of a minor nature cannot be effected by way of an amendment; application for a new permit would have to be made.
                </div>
            </div>
            `;
        }
        
        function getOrdinal(n) {
            if (n > 3 && n < 21) return 'th';
            switch (n % 10) {
                case 1: return 'st';
                case 2: return 'nd';
                case 3: return 'rd';
                default: return 'th';
            }
        }

        function escapeHtml(str) {
            if (!str) return '';
            return str.replace(/[&<>]/g, function(m) {
                if (m === '&') return '&amp;';
                if (m === '<') return '&lt;';
                if (m === '>') return '&gt;';
                return m;
            });
        }

        async function verifyPermit() {
            const permitNo = document.getElementById('verifyPermitNo').value.trim();
            const resultDiv = document.getElementById('verifyResult');
            
            if (!permitNo) {
                resultDiv.innerHTML = '<div class="error">Please enter a Permit Number.</div>';
                return;
            }
            
            resultDiv.innerHTML = '<div class="loading">⏳ Verifying...</div>';
            
            try {
                const { data, error } = await supabase
                    .from('development_permits')
                    .select('*')
                    .eq('permit_number', permitNo);
                
                if (error) throw error;
                
                if (!data || data.length === 0) {
                    resultDiv.innerHTML = `<div class="error">❌ INVALID - Permit "${escapeHtml(permitNo)}" not found in official council records.</div>`;
                    return;
                }
                
                const permit = data[0];
                const isValid = permit.status === 'active' && new Date(permit.expiry_date) >= new Date();
                
                if (isValid) {
                    resultDiv.innerHTML = `
                        <div class="success">
                            <strong>✅ VERIFIED - VALID OFFICIAL DEVELOPMENT PERMIT</strong><br><br>
                            <strong>Permit Number:</strong> ${escapeHtml(permit.permit_number)}<br>
                            <strong>Property:</strong> ${escapeHtml(permit.property_location)}<br>
                            <strong>Issued To:</strong> ${escapeHtml(permit.applicant_name)}${permit.company_name ? ' (' + escapeHtml(permit.company_name) + ')' : ''}<br>
                            <strong>Issue Date:</strong> ${new Date(permit.issue_date).toLocaleDateString()}<br>
                            <strong>Expiry Date:</strong> ${new Date(permit.expiry_date).toLocaleDateString()}<br>
                            <strong>Status:</strong> ✅ Active Council Record
                        </div>
                    `;
                } else {
                    resultDiv.innerHTML = `<div class="error">❌ INVALID - This permit has expired or been revoked.</div>`;
                }
            } catch (error) {
                resultDiv.innerHTML = `<div class="error">❌ Verification error. Please try again.</div>`;
            }
        }

        // Form submission
        const form = document.getElementById('permitForm');
        if (form) {
            form.addEventListener('submit', async function(e) {
                e.preventDefault();
                
                const resultDiv = document.getElementById('issueResult');
                const displayArea = document.getElementById('permitDisplayArea');
                const submitBtn = form.querySelector('button[type="submit"]');
                
                submitBtn.disabled = true;
                submitBtn.textContent = '⏳ Generating Permit...';
                resultDiv.innerHTML = '<div class="loading">⏳ Processing and generating document...</div>';
                displayArea.classList.add('hidden');
                
                try {
                    const permitNumber = generatePermitNumber();
                    const verificationUrl = `https://${window.location.hostname}${window.location.pathname}?verify=${permitNumber}`;
                    const qrApiUrl = `https://api.qrserver.com/v1/create-qr-code/?size=120x120&data=${encodeURIComponent(verificationUrl)}`;
                    
                    const permitData = {
                        permit_number: permitNumber,
                        property_location: document.getElementById('propertyLocation').value.trim(),
                        applicant_name: document.getElementById('applicantName').value.trim(),
                        company_name: document.getElementById('companyName').value.trim() || null,
                        application_date: document.getElementById('applicationDate').value,
                        application_ref: document.getElementById('applicationRef').value.trim(),
                        council_resolution: document.getElementById('councilResolution').value.trim(),
                        commercial_uses: document.getElementById('commercialUses').value.trim(),
                        issued_at_town: document.getElementById('issuedAtTown').value.trim(),
                        issue_date: document.getElementById('issueDate').value,
                        applicant_rep: document.getElementById('applicantRep').value.trim(),
                        applicant_id: document.getElementById('applicantId').value.trim(),
                        applicant_witness: document.getElementById('applicantWitness').value.trim(),
                        council_rep: document.getElementById('councilRep').value.trim(),
                        council_witness: document.getElementById('councilWitness').value.trim(),
                        expiry_date: document.getElementById('expiryDate').value,
                        qr_code_url: qrApiUrl,
                        status: 'active',
                        issued_by_email: currentStaffUser
                    };
                    
                    // Validate required fields
                    for (const [key, value] of Object.entries(permitData)) {
                        if (value === null || value === undefined || value === '') {
                            if (key !== 'company_name' && key !== 'qr_code_url') {
                                throw new Error(`Please fill in all required fields. Missing: ${key}`);
                            }
                        }
                    }
                    
                    // Save to Supabase
                    const { error: insertError } = await supabase
                        .from('development_permits')
                        .insert([permitData]);
                    
                    if (insertError) throw insertError;
                    
                    // Generate and display permit
                    const permitHTML = generatePermitHTML(permitData, qrApiUrl);
                    displayArea.innerHTML = permitHTML;
                    displayArea.classList.remove('hidden');
                    
                    resultDiv.innerHTML = `<div class="success">✅ Permit ${permitNumber} issued successfully!</div>`;
                    
                    // Scroll to document
                    displayArea.scrollIntoView({ behavior: 'smooth' });
                    
                    // Reset form but keep some defaults
                    document.getElementById('applicantName').value = '';
                    document.getElementById('companyName').value = '';
                    document.getElementById('applicationRef').value = '';
                    document.getElementById('applicantRep').value = '';
                    document.getElementById('applicantId').value = '';
                    document.getElementById('applicantWitness').value = '';
                    
                } catch (error) {
                    resultDiv.innerHTML = `<div class="error">❌ Error: ${error.message}</div>`;
                } finally {
                    submitBtn.disabled = false;
                    submitBtn.textContent = '📄 Generate Development Permit & Download PDF';
                }
            });
        }
        
        // Handle URL verification param
        const urlParams = new URLSearchParams(window.location.search);
        const verifyParam = urlParams.get('verify');
        if (verifyParam && document.getElementById('verifyPermitNo')) {
            document.getElementById('verifyPermitNo').value = verifyParam;
            verifyPermit();
            showTab('verify');
        }
        
        function downloadPDF() {
            window.print();
        }
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manyame RDC - Issue Development Permit</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #f0f2f5; min-height: 100vh; padding: 20px; }
        .back-link { max-width: 1100px; margin: 0 auto 15px auto; }
        .back-link a { color: #1e3c72; text-decoration: none; font-weight: bold; }
        .container { max-width: 1100px; margin: 0 auto; background: white; border-radius: 16px; box-shadow: 0 4px 20px rgba(0,0,0,0.1); overflow: hidden; }
        .content { padding: 30px; }
        .form-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 20px; }
        .form-group { margin-bottom: 5px; }
        .form-group.full-width { grid-column: span 2; }
        label { display: block; font-weight: 600; margin-bottom: 8px; color: #333; font-size: 13px; }
        input, textarea { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 8px; font-size: 14px; font-family: inherit; }
        textarea { resize: vertical; min-height: 80px; }
        button { background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%); color: white; padding: 14px; border: none; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; width: 100%; transition: transform 0.2s; }
        button:hover { transform: translateY(-2px); }
        .send-btn { background: #007bff; margin-top: 20px; }
        .send-btn:hover { background: #0069d9; }
        .staff-info { background: #e9ecef; padding: 12px 15px; border-radius: 8px; margin-bottom: 25px; display: flex; justify-content: space-between; align-items: center; }
        .logout-btn { background: #6c757d; width: auto; padding: 6px 15px; font-size: 13px; }
        .error { background: #f8d7da; color: #721c24; padding: 15px; border-radius: 8px; margin-top: 20px; border-left: 5px solid #dc3545; }
        .success { background: #d4edda; color: #155724; padding: 15px; border-radius: 8px; margin-top: 20px; border-left: 5px solid #28a745; }
        .loading { text-align: center; padding: 20px; color: #666; }
        .warning { background: #fff3cd; color: #856404; padding: 12px; border-radius: 8px; margin-bottom: 20px; border-left: 5px solid #ffc107; font-size: 14px; }
        .info { background: #cce5ff; color: #004085; padding: 12px; border-radius: 8px; margin-bottom: 20px; border-left: 5px solid #007bff; }
        .approval-links { background: #e9ecef; padding: 15px; border-radius: 8px; margin: 15px 0; }
        .approval-links input { width: 100%; padding: 8px; margin: 5px 0; font-size: 12px; border: 1px solid #ccc; border-radius: 4px; background: white; }
        .copy-btn { background: #28a745; padding: 6px 12px; font-size: 12px; width: auto; margin-top: 5px; }
        .hidden { display: none; }
    </style>
</head>
<body>
    <div class="back-link">
        <a href="index.html">← Back to Document Management</a>
    </div>
    
    <div class="container">
        <div class="content">
            <div id="staffInfoSection" class="staff-info">
                <span>Logged in as: <strong id="staffName"></strong></span>
                <button class="logout-btn" onclick="staffLogout()">Logout</button>
            </div>
            
            <div id="formSection">
                <div class="info">
                    <strong>Approval Workflow:</strong> Officer creates permit → HOD approves → CEO approves → PDF generated automatically
                </div>
                
                <div class="warning">
                    <strong>Important:</strong> Please complete all required fields below. After submission, the permit will be sent to HOD for approval.
                </div>
                
                <div class="form-grid">
                    <div class="form-group">
                        <label>Property Location *</label>
                        <input type="text" id="propertyLocation" required placeholder="e.g., Subdivision 1 of Enslidale Farm">
                    </div>
                    <div class="form-group">
                        <label>Applicant Name *</label>
                        <input type="text" id="applicantName" required placeholder="e.g., Tonderai Nyamandi">
                    </div>
                    <div class="form-group">
                        <label>Company Name</label>
                        <input type="text" id="companyName" placeholder="e.g., Youth Engage Investments">
                    </div>
                    <div class="form-group">
                        <label>Application Date *</label>
                        <input type="date" id="applicationDate" required>
                    </div>
                    <div class="form-group">
                        <label>Application Reference No *</label>
                        <input type="text" id="applicationRef" required placeholder="e.g., MANYA/05/2023">
                    </div>
                    <div class="form-group">
                        <label>Council Resolution No *</label>
                        <input type="text" id="councilResolution" required placeholder="e.g., Full Council FC13 645.12">
                    </div>
                    <div class="form-group full-width">
                        <label>Commercial Uses *</label>
                        <textarea id="commercialUses" required>WAREHOUSE, PETROL FILLING STATION, FOOD COURT, TRUCK STOP, SHOPPING MALL</textarea>
                    </div>
                    <div class="form-group">
                        <label>Issued At (Town) *</label>
                        <input type="text" id="issuedAtTown" required value="BEATRICE">
                    </div>
                    <div class="form-group">
                        <label>Issue Date *</label>
                        <input type="date" id="issueDate" required>
                    </div>
                    <div class="form-group">
                        <label>Applicant Representative *</label>
                        <input type="text" id="applicantRep" required placeholder="e.g., CHARLES SIWELA">
                    </div>
                    <div class="form-group">
                        <label>Applicant ID Number *</label>
                        <input type="text" id="applicantId" required placeholder="e.g., 59 069210 M 32">
                    </div>
                    <div class="form-group">
                        <label>Applicant Witness *</label>
                        <input type="text" id="applicantWitness" required placeholder="e.g., N.Tsaha">
                    </div>
                    <div class="form-group">
                        <label>Council Representative *</label>
                        <input type="text" id="councilRep" required placeholder="e.g., F.Guta">
                    </div>
                    <div class="form-group">
                        <label>Council Witness *</label>
                        <input type="text" id="councilWitness" required placeholder="e.g., C.Murepa">
                    </div>
                    <div class="form-group">
                        <label>Expiry Date *</label>
                        <input type="date" id="expiryDate" required>
                    </div>
                </div>
                
                <button class="send-btn" onclick="sendForApproval(event)">Send for Approval (HOD → CEO)</button>
                
                <div id="issueResult"></div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        var SUPABASE_URL = 'https://ocojsigqagaehlebubdw.supabase.co';
        var SUPABASE_ANON_KEY = 'sb_publishable_njwmRaZK-bnzut7bZPDpNQ_0VolCv-C';
        
        var supabaseClient = null;
        var currentStaffUser = sessionStorage.getItem('staffEmail');
        var currentStaffName = sessionStorage.getItem('staffDisplayName');
        var today = new Date().toISOString().split('T')[0];
        
        function checkStaffLogin() {
            if (!currentStaffUser || !currentStaffName) {
                document.getElementById('formSection').innerHTML = '<div class="error">Please login first. <a href="index.html">Go to Login</a></div>';
                return false;
            }
            document.getElementById('staffName').textContent = currentStaffName;
            return true;
        }
        
        function initSupabase() {
            if (!supabaseClient && typeof window.supabase !== 'undefined') {
                supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
            }
            return supabaseClient;
        }
        
        function staffLogout() {
            if(supabaseClient) supabaseClient.auth.signOut();
            sessionStorage.removeItem('staffEmail');
            sessionStorage.removeItem('staffDisplayName');
            window.location.href = 'index.html';
        }
        
        function setDefaultDates() {
            var appDate = document.getElementById('applicationDate');
            var issueDate = document.getElementById('issueDate');
            var expiryDate = document.getElementById('expiryDate');
            if (appDate && !appDate.value) {
                var d = new Date();
                d.setFullYear(d.getFullYear() - 1);
                appDate.value = d.toISOString().split('T')[0];
            }
            if (issueDate && !issueDate.value) issueDate.value = today;
            if (expiryDate && !expiryDate.value) {
                var d = new Date();
                d.setFullYear(d.getFullYear() + 1);
                expiryDate.value = d.toISOString().split('T')[0];
            }
        }
        
        function generatePermitNumber() {
            var year = new Date().getFullYear();
            var random = Math.floor(Math.random() * 900) + 100;
            return 'MANY/' + random + '/' + year;
        }
        
        function generateApprovalToken() {
            return 'tok_' + Date.now() + '_' + Math.random().toString(36).substr(2, 16);
        }
        
        function copyToClipboard(text) {
            navigator.clipboard.writeText(text);
            alert('Link copied to clipboard!');
        }
        
        async function sendForApproval(event) {
            var resultDiv = document.getElementById('issueResult');
            var sendBtn = event.target;
            
            var propertyLocation = document.getElementById('propertyLocation').value.trim();
            var applicantName = document.getElementById('applicantName').value.trim();
            var companyName = document.getElementById('companyName').value.trim();
            var applicationDate = document.getElementById('applicationDate').value;
            var applicationRef = document.getElementById('applicationRef').value.trim();
            var councilResolution = document.getElementById('councilResolution').value.trim();
            var commercialUses = document.getElementById('commercialUses').value.trim();
            var issuedAtTown = document.getElementById('issuedAtTown').value.trim();
            var issueDate = document.getElementById('issueDate').value;
            var applicantRep = document.getElementById('applicantRep').value.trim();
            var applicantId = document.getElementById('applicantId').value.trim();
            var applicantWitness = document.getElementById('applicantWitness').value.trim();
            var councilRep = document.getElementById('councilRep').value.trim();
            var councilWitness = document.getElementById('councilWitness').value.trim();
            var expiryDate = document.getElementById('expiryDate').value;
            
            if (!propertyLocation || !applicantName || !applicationDate || !applicationRef || !councilResolution || !commercialUses || !issuedAtTown || !issueDate || !applicantRep || !applicantId || !applicantWitness || !councilRep || !councilWitness || !expiryDate) {
                resultDiv.innerHTML = '<div class="error">Please fill in all required fields.</div>';
                return;
            }
            
            sendBtn.disabled = true;
            sendBtn.textContent = 'Creating permit and sending for approval...';
            resultDiv.innerHTML = '<div class="loading">Creating permit and setting up approval workflow...</div>';
            
            try {
                initSupabase();
                var permitNumber = generatePermitNumber();
                var baseUrl = window.location.origin + '/TondeManyameRDC';
                var verificationUrl = baseUrl + '/index.html?id=' + permitNumber;
                var qrApiUrl = 'https://api.qrserver.com/v1/create-qr-code/?size=120x120&data=' + encodeURIComponent(verificationUrl);
                
                var documentData = {
                    permit_number: permitNumber,
                    property_location: propertyLocation,
                    applicant_name: applicantName,
                    company_name: companyName || null,
                    application_date: applicationDate,
                    application_ref: applicationRef,
                    council_resolution: councilResolution,
                    commercial_uses: commercialUses,
                    issued_at_town: issuedAtTown,
                    issue_date: issueDate,
                    applicant_rep: applicantRep,
                    applicant_id: applicantId,
                    applicant_witness: applicantWitness,
                    council_rep: councilRep,
                    council_witness: councilWitness,
                    expiry_date: expiryDate,
                    qr_code_url: qrApiUrl,
                    verification_url: verificationUrl
                };
                
                // 1. Insert into issued_documents with pending status
                var { data: permitData, error: permitError } = await supabaseClient
                    .from('issued_documents')
                    .insert([{
                        document_type: 'development_permit',
                        document_number: permitNumber,
                        document_data: documentData,
                        issued_to: applicantName,
                        issued_by_email: currentStaffUser,
                        issued_by_name: currentStaffName,
                        issue_date: issueDate,
                        expiry_date: expiryDate,
                        status: 'pending_approval',
                        approval_status: 'pending_hod',
                        hod_approved: false,
                        ceo_approved: false,
                        qr_code_url: qrApiUrl,
                        verification_url: verificationUrl
                    }])
                    .select();
                
                if (permitError) throw permitError;
                
                var permitId = permitData[0].id;
                
                // 2. Get HOD from database
                var { data: hodData, error: hodError } = await supabaseClient
                    .from('hods')
                    .select('*')
                    .eq('is_active', true)
                    .limit(1);
                
                if (hodError) throw hodError;
                if (!hodData || hodData.length === 0) {
                    // Create default HOD if none exists
                    var { data: defaultHod, error: defaultHodError } = await supabaseClient
                        .from('hods')
                        .insert([{
                            name: 'F. Guta',
                            email: 'fguta@manyame.gov.zw',
                            title: 'Director',
                            department: 'Planning',
                            is_active: true
                        }])
                        .select();
                    
                    if (defaultHodError) throw defaultHodError;
                    hodData = defaultHod;
                }
                
                var hod = hodData[0];
                
                // 3. Get CEO from database
                var { data: ceoData, error: ceoError } = await supabaseClient
                    .from('ceos')
                    .select('*')
                    .eq('is_active', true)
                    .limit(1);
                
                if (ceoError) throw ceoError;
                if (!ceoData || ceoData.length === 0) {
                    // Create default CEO if none exists
                    var { data: defaultCeo, error: defaultCeoError } = await supabaseClient
                        .from('ceos')
                        .insert([{
                            name: 'C. Murepa',
                            email: 'cmurepa@manyame.gov.zw',
                            title: 'Chief Executive Officer',
                            is_active: true
                        }])
                        .select();
                    
                    if (defaultCeoError) throw defaultCeoError;
                    ceoData = defaultCeo;
                }
                
                var ceo = ceoData[0];
                
                // 4. Create HOD approval token
                var hodToken = generateApprovalToken();
                var tokenExpiry = new Date();
                tokenExpiry.setDate(tokenExpiry.getDate() + 7);
                
                var { error: hodApprovalError } = await supabaseClient
                    .from('approvals')
                    .insert([{
                        permit_id: permitId,
                        permit_number: permitNumber,
                        permit_data: documentData,
                        approval_level: 'hod',
                        status: 'pending',
                        approver_name: hod.name,
                        approver_email: hod.email,
                        approver_title: hod.title,
                        approval_token: hodToken,
                        token_expires_at: tokenExpiry.toISOString()
                    }]);
                
                if (hodApprovalError) throw hodApprovalError;
                
                // 5. Create CEO approval token
                var ceoToken = generateApprovalToken();
                
                var { error: ceoApprovalError } = await supabaseClient
                    .from('approvals')
                    .insert([{
                        permit_id: permitId,
                        permit_number: permitNumber,
                        permit_data: documentData,
                        approval_level: 'ceo',
                        status: 'pending',
                        approver_name: ceo.name,
                        approver_email: ceo.email,
                        approver_title: ceo.title,
                        approval_token: ceoToken,
                        token_expires_at: tokenExpiry.toISOString()
                    }]);
                
                if (ceoApprovalError) throw ceoApprovalError;
                
                // 6. Generate approval URLs
                var hodApprovalUrl = baseUrl + '/approve-permit.html?token=' + hodToken + '&level=hod';
                var ceoApprovalUrl = baseUrl + '/approve-permit.html?token=' + ceoToken + '&level=ceo';
                
                // 7. Display result with approval links
                resultDiv.innerHTML = `
                    <div class="success">
                        <strong>Permit Created Successfully!</strong><br><br>
                        <strong>Permit Number:</strong> ${permitNumber}<br>
                        <strong>Status:</strong> Waiting for HOD Approval<br><br>
                        
                        <div class="approval-links">
                            <strong>Step 1: HOD Approval Link</strong><br>
                            <input type="text" id="hodLink" value="${hodApprovalUrl}" readonly>
                            <button class="copy-btn" onclick="copyToClipboard(document.getElementById('hodLink').value)">Copy Link</button>
                            <br><br>
                            <strong>Step 2: CEO Approval Link (activate after HOD approves)</strong><br>
                            <input type="text" id="ceoLink" value="${ceoApprovalUrl}" readonly>
                            <button class="copy-btn" onclick="copyToClipboard(document.getElementById('ceoLink').value)">Copy Link</button>
                            <br><br>
                            <small>Note: The CEO link will only work after the HOD has approved the permit.</small>
                        </div>
                        
                        <p><strong>Next Steps:</strong><br>
                        1. Share the HOD approval link with the Head of Department<br>
                        2. After HOD approves, share the CEO link with the CEO<br>
                        3. Once both approve, the final PDF will be generated automatically</p>
                    </div>
                `;
                
                // Clear form fields
                document.getElementById('applicantName').value = '';
                document.getElementById('companyName').value = '';
                document.getElementById('applicationRef').value = '';
                document.getElementById('applicantRep').value = '';
                document.getElementById('applicantId').value = '';
                document.getElementById('applicantWitness').value = '';
                setDefaultDates();
                
            } catch (error) {
                console.error('Error:', error);
                resultDiv.innerHTML = '<div class="error">Error: ' + error.message + '</div>';
            } finally {
                sendBtn.disabled = false;
                sendBtn.textContent = 'Send for Approval (HOD → CEO)';
            }
        }
        
        if (!checkStaffLogin()) {
            // Halt logic active
        } else {
            setDefaultDates();
        }
    </script>
</body>
</html>

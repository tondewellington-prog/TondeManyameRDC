<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manyame RDC - Create Development Permit</title>
    <!-- Google Fonts for professional corporate typography -->
    <link href="https://fonts.googleapis.com/css2?family=Segoe+UI:wght@400;600;700&display=swap" rel="stylesheet">
    <!-- Supabase JS Client CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --primary-gradient: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            --dark-slate: #1e293b;
            --border-color: #cbd5e1;
            --text-dark: #334155;
            --warning-bg: #fff3cd;
            --warning-border: #ffc107;
            --warning-text: #856404;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #f8fafc;
            color: var(--text-dark);
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            background: #ffffff;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
        }

        .header {
            text-align: center;
            border-bottom: 2px solid #e2e8f0;
            padding-bottom: 20px;
            margin-bottom: 30px;
        }

        .header h1 {
            background: var(--primary-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin: 0;
            font-size: 28px;
            font-weight: 700;
        }

        .header p {
            color: #64748b;
            margin-top: 5px;
            font-size: 14px;
        }

        /* Form Layout Styles */
        .form-section {
            margin-bottom: 30px;
        }

        .form-section h3 {
            color: #1e3c72;
            border-left: 4px solid #1e3c72;
            padding-left: 10px;
            margin-bottom: 20px;
            font-size: 18px;
        }

        .grid-2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            margin-bottom: 15px;
        }

        label {
            font-weight: 600;
            margin-bottom: 6px;
            font-size: 13px;
            color: var(--dark-slate);
        }

        input, textarea, select {
            padding: 10px 14px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            font-size: 14px;
            font-family: inherit;
            transition: all 0.3s ease;
        }

        input:focus, textarea:focus, select:focus {
            outline: none;
            border-color: #2a5298;
            box-shadow: 0 0 0 3px rgba(42, 82, 152, 0.15);
        }

        /* Action Controls */
        .btn-container {
            text-align: right;
            margin-top: 30px;
        }

        .btn {
            background: var(--primary-gradient);
            color: white;
            border: none;
            padding: 12px 28px;
            font-size: 15px;
            font-weight: 600;
            border-radius: 6px;
            cursor: pointer;
            transition: opacity 0.2s ease;
        }

        .btn:hover {
            opacity: 0.9;
        }

        .btn:disabled {
            background: #cbd5e1;
            cursor: not-allowed;
        }

        /* System Notification Containers */
        .error-box {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
            padding: 12px;
            border-radius: 6px;
            margin-top: 15px;
            font-size: 14px;
        }

        .success-box {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
            padding: 15px;
            border-radius: 6px;
            margin-top: 15px;
            font-size: 14px;
        }

        .warning-box {
            background: var(--warning-bg);
            color: var(--warning-text);
            border-left: 5px solid var(--warning-border);
            padding: 15px;
            border-radius: 4px;
            margin-top: 15px;
            margin-bottom: 15px;
            font-size: 14px;
            line-height: 1.5;
        }

        .hidden {
            display: none;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>Manyame Rural District Council</h1>
        <p>Town Planning Department — Town and Country Planning Act [Chapter 29:12]</p>
        <h2 style="font-size: 18px; color: var(--dark-slate); margin-top: 15px;">Development Permit Setup Console</h2>
    </div>

    <form id="permitForm" onsubmit="sendForApproval(event)">
        <!-- Section 1: Property & Legal Context -->
        <div class="form-section">
            <h3>1. Property Reference Details</h3>
            <div class="form-group">
                <label for="propertyLocation">Description of Property / Land Parcel Location</label>
                <input type="text" id="propertyLocation" placeholder="e.g., Subdivision 1 of Enslidale Farm, Manyame RDC" required>
            </div>
            <div class="grid-2">
                <div class="form-group">
                    <label for="councilResolution">Council Resolution Reference Number</label>
                    <input type="text" id="councilResolution" placeholder="e.g., C/M/2026/04" required>
                </div>
                <div class="form-group">
                    <label for="commercialUses">Approved Commercial Land-Use Classes</label>
                    <input type="text" id="commercialUses" placeholder="e.g., Warehouse, Truck Stop, Petrol Station" required>
                </div>
            </div>
        </div>

        <!-- Section 2: Applicant Identity Matrix -->
        <div class="form-section">
            <h3>2. Applicant Representation Credentials</h3>
            <div class="grid-2">
                <div class="form-group">
                    <label for="applicantName">Full Name of Applicant / Corporate Entity</label>
                    <input type="text" id="applicantName" placeholder="Applicant Legal Name" required>
                </div>
                <div class="form-group">
                    <label for="applicationRef">Application Reference ID</label>
                    <input type="text" id="applicationRef" placeholder="e.g., RDC/PLN/2026/894" required>
                </div>
            </div>
            <div class="grid-2">
                <div class="form-group">
                    <label for="applicationDate">Date of Statutory Application Submission</label>
                    <input type="date" id="applicationDate" required>
                </div>
                <div class="form-group">
                    <label for="issuedAtTown">Issued at (Administrative Center Location)</label>
                    <input type="text" id="issuedAtTown" value="Beatrice" required>
                </div>
            </div>
            <div class="grid-2">
                <div class="form-group">
                    <label for="issueDate">Effective Validation Date</label>
                    <input type="date" id="issueDate" required>
                </div>
                <div class="form-group">
                    <label for="expiryDate">Statutory Term Expiration Date</label>
                    <input type="date" id="expiryDate" required>
                </div>
            </div>
        </div>

        <!-- Section 3: Signature Witness Layout Definitions -->
        <div class="form-section">
            <h3>3. Processing Officers & Signature Tracking Context</h3>
            <div class="grid-2">
                <div class="form-group">
                    <label for="applicantRep">Applicant Signatory Name</label>
                    <input type="text" id="applicantRep" placeholder="Primary Representative" required>
                </div>
                <div class="form-group">
                    <label for="applicantId">Applicant ID / Passport Number</label>
                    <input type="text" id="applicantId" placeholder="National Identity Number" required>
                </div>
            </div>
            <div class="grid-2">
                <div class="form-group">
                    <label for="applicantWitness">Witness to Applicant (Full Name)</label>
                    <input type="text" id="applicantWitness" placeholder="Witness Full Name" required>
                </div>
                <div class="form-group">
                    <label for="councilRep">Council Executive Representative Name</label>
                    <input type="text" id="councilRep" value="Planning Officer" required>
                </div>
            </div>
            <div class="form-group">
                <label for="councilWitness">Witness to Council Signature (Full Name)</label>
                <input type="text" id="councilWitness" placeholder="Council Attesting Witness Name" required>
            </div>
        </div>

        <!-- Notification and Alert Nodes -->
        <div id="duplicateWarningMsg" class="warning-box hidden"></div>
        <div id="issueResult"></div>

        <div class="btn-container">
            <button type="submit" id="submitBtn" class="btn">Create Permit and Send to HOD</button>
        </div>
    </form>
</div>

<script>
    // System Keys & Global Instances
    var SUPABASE_URL = "https://your-supabase-url.supabase.co"; 
    var SUPABASE_KEY = "your-anon-key";
    var supabaseClient = null;

    function initSupabase() {
        if (!supabaseClient) {
            if (typeof supabase !== 'undefined' && supabase.createClient) {
                supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
            } else {
                console.error("Supabase CDN Library failed loading instances.");
            }
        }
    }

    function escapeHtml(string) {
        var entityMap = {
            '&': '&amp;',
            '<': '&lt;',
            '>': '&gt;',
            '"': '&quot;',
            "'": '&#39;',
            '/': '&#x2F;'
        };
        return String(string).replace(/[&<>"'\/]/g, function (s) {
            return entityMap[s];
        });
    }

    function generatePermitNumber() {
        var randInt = Math.floor(100 + Math.random() * 900);
        var currentYear = new Date().getFullYear();
        return "MANY/" + randInt + "/" + currentYear;
    }

    // Master Submit Handler with Duplicate Prevention Routing Check
    async function sendForApproval(event) {
        event.preventDefault();

        var sendBtn = document.getElementById('submitBtn');
        var resultDiv = document.getElementById('issueResult');
        var warningDiv = document.getElementById('duplicateWarningMsg');

        // Clear existing screen messages
        resultDiv.innerHTML = '';
        warningDiv.classList.add('hidden');
        
        // Engage processing visual styles
        sendBtn.disabled = true;
        sendBtn.textContent = 'Analyzing System Registry...';

        // Extract and capture element node structures
        var propertyLocation = document.getElementById('propertyLocation').value.trim();
        var councilResolution = document.getElementById('councilResolution').value.trim();
        var commercialUses = document.getElementById('commercialUses').value.trim();
        var applicantName = document.getElementById('applicantName').value.trim();
        var applicationRef = document.getElementById('applicationRef').value.trim();
        var applicationDate = document.getElementById('applicationDate').value;
        var issuedAtTown = document.getElementById('issuedAtTown').value.trim();
        var issueDate = document.getElementById('issueDate').value;
        var expiryDate = document.getElementById('expiryDate').value;
        var applicantRep = document.getElementById('applicantRep').value.trim();
        var applicantId = document.getElementById('applicantId').value.trim();
        var applicantWitness = document.getElementById('applicantWitness').value.trim();
        var councilRep = document.getElementById('councilRep').value.trim();
        var councilWitness = document.getElementById('councilWitness').value.trim();

        // 1. Mandatory Form Field Fallback Validation Validation Check
        if (!propertyLocation || !applicantName || !applicationDate || !applicationRef || !councilResolution || !commercialUses || !issuedAtTown || !issueDate || !applicantRep || !applicantId || !applicantWitness || !councilRep || !councilWitness || !expiryDate) {
            resultDiv.innerHTML = '<div class="error-box">Please fill in all required layout fields before submitting.</div>';
            sendBtn.disabled = false;
            sendBtn.textContent = 'Create Permit and Send to HOD';
            return;
        }

        try {
            initSupabase();

            if (!supabaseClient) {
                resultDiv.innerHTML = '<div class="error-box">Database Connection Error. Please verify your Supabase CDN Initialization details.</div>';
                sendBtn.disabled = false;
                sendBtn.textContent = 'Create Permit and Send to HOD';
                return;
            }

            // =================================================================
            // ASYNCHRONOUS DUPLICATE PRE-FLIGHT CHECK
            // =================================================================
            // Look inside the document_data JSON payload mapping block directly
            var { data: existingDoc, error: checkError } = await supabaseClient
                .from('issued_documents')
                .select('document_number, property_location, issue_date')
                .eq('document_data->>council_resolution', councilResolution)
                .maybeSingle();

            if (checkError) {
                console.warn("Non-fatal validation registry look-up warning:", checkError);
            }

            if (existingDoc) {
                // STOP PIPELINE: Intercept execution block to reject duplicate creation
                warningDiv.innerHTML = `🛑 <strong>Submission Blocked:</strong> A Development Permit already exists under Council Resolution <strong>"${escapeHtml(councilResolution)}"</strong>.<br><br>` +
                                       `• <strong>Existing Permit Reference:</strong> ${existingDoc.document_number}<br>` +
                                       `• <strong>Assigned Parcel Location:</strong> ${escapeHtml(existingDoc.property_location)}<br>` +
                                       `• <strong>Authorized Issue Date:</strong> ${existingDoc.issue_date}`;
                warningDiv.classList.remove('hidden');

                // Return execution control gracefully to user without altering server states
                sendBtn.disabled = false;
                sendBtn.textContent = 'Create Permit and Send to HOD';
                return; 
            }
            // =================================================================

            // No duplicate record was found. Proceed with standard processing sequence safely.
            sendBtn.textContent = 'Generating Secure Permit Matrix...';
            var generatedDocId = generatePermitNumber();

            // Construct application payload tree
            var docDataPayload = {
                property_location: propertyLocation,
                council_resolution: councilResolution,
                commercial_uses: commercialUses,
                applicant_name: applicantName,
                application_ref: applicationRef,
                application_date: applicationDate,
                issued_at_town: issuedAtTown,
                issue_date: issueDate,
                expiry_date: expiryDate,
                applicant_rep: applicantRep,
                applicant_id: applicantId,
                applicant_witness: applicantWitness,
                council_rep: councilRep,
                council_witness: councilWitness
            };

            // Insert new unique row entry mapping structure
            var { data: insertData, error: insertError } = await supabaseClient
                .from('issued_documents')
                .insert([{
                    document_number: generatedDocId,
                    issued_to: applicantName,
                    property_location: propertyLocation,
                    status: 'pending_hod',
                    issue_date: issueDate,
                    expiry_date: expiryDate,
                    hod_approved: false,
                    ceo_approved: false,
                    document_data: docDataPayload  // Injects complete layout map
                }])
                .select();

            if (insertError) {
                // Catch hard fallback DB unique key rule breaks (e.g. status code 23505)
                if (insertError.code === '23505') {
                    resultDiv.innerHTML = '<div class="error-box"><strong>Database Integrity Rejection:</strong> A processing instance conflict indicates this record is already synchronized with server structures.</div>';
                } else {
                    resultDiv.innerHTML = '<div class="error-box">Database Insertion failure: ' + escapeHtml(insertError.message) + '</div>';
                }
                sendBtn.disabled = false;
                sendBtn.textContent = 'Create Permit and Send to HOD';
                return;
            }

            // Document creation successful loop execution handles notification link token hashes
            var generatedEpochToken = "tok_" + Date.now();
            var { error: tokenError } = await supabaseClient
                .from('approvals')
                .insert([{
                    permit_id: insertData[0].id,
                    approval_level: 'hod',
                    approval_token: generatedEpochToken,
                    status: 'pending',
                    token_expires_at: new Date(Date.now() + 7 * 24 * 60 * 60 * 1000).toISOString(), // 7 Days Validation Window
                    permit_data: docDataPayload
                }]);

            if (tokenError) {
                resultDiv.innerHTML = '<div class="error-box">Document entry created, but authorization tokens failed: ' + escapeHtml(tokenError.message) + '</div>';
                sendBtn.disabled = false;
                sendBtn.textContent = 'Create Permit and Send to HOD';
                return;
            }

            // Success feedback rendering sequence 
            var remoteApprovalUrl = window.location.origin + "/approve-permit.html?token=" + generatedEpochToken + "&level=hod";
            
            resultDiv.innerHTML = `
                <div class="success-box">
                    <strong>Permit Successfully Formulated & Logged!</strong><br><br>
                    • <strong>Permit Number:</strong> ${generatedDocId}<br>
                    • <strong>Status Stage:</strong> Sent to HOD for evaluation.<br><br>
                    <span style="font-size:12px; color:#555;"><strong>Internal Routing Notification Link (HOD Approval Link):</strong></span><br>
                    <input type="text" value="${remoteApprovalUrl}" readonly style="width:100%; margin-top:5px; font-size:12px; padding:6px; background:#f1f5f9;" onclick="this.select();">
                </div>
            `;
            
            document.getElementById('permitForm').reset();
            sendBtn.textContent = 'Permit Dispatched';

        } catch (globalError) {
            resultDiv.innerHTML = '<div class="error-box">Critical runtime anomaly: ' + escapeHtml(globalError.message) + '</div>';
            sendBtn.disabled = false;
            sendBtn.textContent = 'Create Permit and Send to HOD';
        }
    }
</script>

</body>
</html>
